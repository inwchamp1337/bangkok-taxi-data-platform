taxi:
  target: dev
  outputs:
    dev:
      type: clickhouse
      schema: taxi
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'default') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'clickhouse_secret') }}"
      dbname: "{{ env_var('CLICKHOUSE_DB', 'taxi') }}"
      secure: false
      verify: false
      check_exchange: true
      custom_settings:
        max_memory_usage: 10000000000
