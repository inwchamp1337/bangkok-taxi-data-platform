version: 2

models:
  - name: int_trip_segments
    description: >
      Detects individual taxi trips by tracking passenger_lamp transitions.
      A trip starts when passenger_lamp changes from 1 (vacant) to 0 (occupied)
      and ends when it changes back from 0 to 1.
    columns:
      - name: vehicle_id
        tests:
          - not_null
      - name: trip_id
        description: "Unique trip identifier (vehicle_id + trip start time)"
        tests:
          - not_null
      - name: pickup_at
        description: "Time of passenger pickup"
      - name: dropoff_at
        description: "Time of passenger dropoff"

  - name: int_taxi_sessions
    description: >
      Groups consecutive GPS pings into sessions based on engine state
      and time gaps. A new session starts when the gap between consecutive
      pings exceeds 10 minutes or the engine state changes.
    columns:
      - name: vehicle_id
        tests:
          - not_null
      - name: session_id
        description: "Unique session identifier"
        tests:
          - not_null
