# Dashboard provisioning config — tells Grafana where to find dashboard JSON files
apiVersion: 1

providers:
  - name: "Bangkok Taxi Dashboards"
    orgId: 1
    folder: "Bangkok Taxi"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
