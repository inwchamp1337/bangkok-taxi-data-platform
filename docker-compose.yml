# =============================================================================
# Bangkok Taxi Data Platform — Docker Compose
# =============================================================================
# Usage: docker compose up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MinIO — S3-Compatible Object Storage (Raw Data Lake)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: taxi-minio
    ports:
      - "9000:9000"     # API
      - "9001:9001"     # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taxi-network

  minio-init:
    image: minio/mc:latest
    container_name: taxi-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/raw;
      mc mb --ignore-existing local/quarantine;
      mc mb --ignore-existing local/validated;
      echo '✅ Buckets created';
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_123}
    networks:
      - taxi-network

  # ---------------------------------------------------------------------------
  # ClickHouse — OLAP Data Warehouse
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: taxi-clickhouse
    ports:
      - "8123:8123"     # HTTP interface
      - "9009:9000"     # Native protocol (remapped to avoid MinIO conflict)
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_secret}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-taxi}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infrastructure/docker/clickhouse/config/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - ./scripts/setup_clickhouse.sql:/docker-entrypoint-initdb.d/setup_clickhouse.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "${CLICKHOUSE_PASSWORD:-clickhouse_secret}", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taxi-network

  # ---------------------------------------------------------------------------
  # Airflow Metadata — PostgreSQL (only for Airflow internals)
  # ---------------------------------------------------------------------------
  airflow-postgres:
    image: postgres:16-alpine
    container_name: taxi-airflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taxi-network

  # ---------------------------------------------------------------------------
  # Airflow — Init (one-shot migration + admin user)
  # ---------------------------------------------------------------------------
  airflow-init:
    build:
      context: .
      dockerfile: infrastructure/docker/airflow/Dockerfile
    container_name: taxi-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-taxi-secret-key-change-me}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # Pass infra connection details to Airflow tasks
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_123}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_secret}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-taxi}
      ITIC_BASE_URL: ${ITIC_BASE_URL:-https://itic.longdo.com/opendata/probe-data}
    entrypoint: >
      /bin/bash -c "
      airflow db migrate;
      airflow users create
        --username admin
        --password admin
        --firstname Admin
        --lastname User
        --role Admin
        --email admin@example.com || true;
      echo '✅ Airflow initialized';
      "
    networks:
      - taxi-network

  # ---------------------------------------------------------------------------
  # Airflow — Webserver
  # ---------------------------------------------------------------------------
  airflow-webserver:
    build:
      context: .
      dockerfile: infrastructure/docker/airflow/Dockerfile
    container_name: taxi-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/plugins:/opt/airflow/plugins:ro
      - ./src:/opt/airflow/src:ro
      - ./dbt_taxi:/opt/dbt_taxi:ro
      - ./scripts:/opt/airflow/scripts:ro
      - ./tests:/opt/airflow/tests:ro
      - airflow_logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
    command: airflow webserver --port 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - taxi-network

  # ---------------------------------------------------------------------------
  # Airflow — Scheduler
  # ---------------------------------------------------------------------------
  airflow-scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/airflow/Dockerfile
    container_name: taxi-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/plugins:/opt/airflow/plugins:ro
      - ./src:/opt/airflow/src:ro
      - ./dbt_taxi:/opt/dbt_taxi
      - ./scripts:/opt/airflow/scripts:ro
      - ./tests:/opt/airflow/tests:ro
      - airflow_logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
    command: airflow scheduler
    restart: unless-stopped
    networks:
      - taxi-network

  # ---------------------------------------------------------------------------
  # Grafana — Visualization
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: taxi-grafana
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-grafana_secret}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/docker/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - taxi-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  minio_data:
  clickhouse_data:
  airflow_pg_data:
  airflow_logs:
  grafana_data:

# =============================================================================
# Networks
# =============================================================================
networks:
  taxi-network:
    name: taxi-network
    driver: bridge
